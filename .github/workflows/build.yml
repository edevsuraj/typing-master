name: Build Typing Master

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconsole --onefile --name TypingMaster `
            --icon tools/icon.ico `
            --add-data "index.html;." `
            --add-data "css;css" `
            --add-data "js;js" `
            --add-data "assets;assets" `
            --hidden-import "webview" --hidden-import "clr_loader" --hidden-import "pythonnet" `
            tools/desktop.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingMaster
          path: dist/TypingMaster.exe

